name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies (opl3, z80cpu; no Playwright, so browser tests skip)
        run: npm ci --omit=dev
      - name: Prepare ANIM golden BMPs
        working-directory: test/fixtures/ANIM-To-BMP
        run: |
          for f in Sprites.anim Puck.anim Zam.anim Crowd.anim; do
            node animToBmp.js "$f"
          done
      - run: node tools/build-manifest.js
      # Pull requests run their change-aware tests in tests.yml. Here only the tests the pushed
      # commits can affect run (diff vs the previous main); an unknown base (manual run, new branch) runs everything.
      - run: node test.js --base "${{ github.event.before }}"
      - name: Assemble static site
        run: |
          mkdir -p _site/anim
          cp test/fixtures/ANIM-To-BMP/*.anim _site/anim/
          cp -r public/* _site/
          cp -r lib _site/lib
          cp -r data _site/data
      - name: Fingerprint assets (content-hash cache busting)
        run: node tools/fingerprint-site.js _site
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
